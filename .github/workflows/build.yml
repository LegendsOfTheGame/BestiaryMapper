name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build and, for a v-tag, release"
        required: false
        default: master

jobs:
  build:
    runs-on: ubuntu-latest

    # Creating a release needs write access to repository contents. The default
    # token is read-only, so the build succeeds and only the release step fails.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -o latest.zip https://goatcorp.github.io/dalamud-distrib/stg/latest.zip
          mkdir -p ~/.xlcore/dalamud/Hooks/dev/
          unzip -q latest.zip -d ~/.xlcore/dalamud/Hooks/dev/

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # DalamudPackager writes the installable zip and its manifest here. Keeping
      # them as artifacts means any build can be inspected, not only tagged ones.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BestiaryMapper
          path: |
            BestiaryMapper/bin/Release/BestiaryMapper/latest.zip
            BestiaryMapper/bin/Release/BestiaryMapper/BestiaryMapper.json

      # A tagged push becomes a release, which is what a plugin repository's
      # download link points at.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BestiaryMapper/bin/Release/BestiaryMapper/latest.zip
            BestiaryMapper/bin/Release/BestiaryMapper/BestiaryMapper.json
